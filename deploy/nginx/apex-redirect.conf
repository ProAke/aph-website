# ════════════════════════════════════════════════════════════════════════════
#  aph-ita.co.th (apex) → https://www.aph-ita.co.th
#
#  One canonical host only. Everything else 301s into it, so Google never sees two
#  copies of the site and links/campaigns keep working whichever form people type.
#
#  Before the cut-over the apex still belongs to WordPress — install this file only
#  when the apex starts pointing at the new host (same moment as the www cut-over).
#
#  Install: /etc/nginx/sites-available/aph-apex  → symlink into sites-enabled
#  Cert:    sudo certbot --nginx -d aph-ita.co.th
# ════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen 443 ssl http2;
    server_name aph-ita.co.th;

    ssl_certificate     /etc/letsencrypt/live/aph-ita.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aph-ita.co.th/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 301 (permanent): the move to www is not temporary, and we want the link equity
    return 301 https://www.aph-ita.co.th$request_uri;
}
