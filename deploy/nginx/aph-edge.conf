# ════════════════════════════════════════════════════════════════════════════
#  APH Interactive — edge router for the WordPress → Nuxt cut-over
#
#  The whole migration is decided by ONE variable: $aph_rollout (0–100).
#  WordPress keeps running untouched behind this router until we retire it.
#
#    0   → 100 % WordPress            (before cut-over)
#    1-99→ canary split (sticky per visitor via cookie)
#    100 → 100 % Nuxt
#
#  Instant rollback  =  set $aph_rollout 0; nginx -s reload      (< 1 second)
#  Automatic rollback = upstream Nuxt returns 5xx / times out  → served by WordPress
#
#  Install: /etc/nginx/conf.d/aph-edge.conf  (include inside the site's server{})
#  See scripts/gen-edge-rules.mjs to generate this file with a different weight.
# ════════════════════════════════════════════════════════════════════════════

upstream aph_legacy {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;   # Apache/PHP-FPM + WordPress
    keepalive 32;
}

upstream aph_new {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=5s;    # node .output/server/index.mjs
    keepalive 64;
}

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ── rollout percentage (edit this single number) ────────────────────────────
map $host $aph_rollout { default 0; }          # ← generated value
split_clients "${remote_addr}${http_user_agent}${date_gmt}" $aph_bucket {
    0%      new;
    *       legacy;
}

# ── stickiness: once a visitor is on Nuxt they stay there ───────────────────
map $cookie_aph_edge $aph_sticky {
    default  legacy;
    new      new;
    legacy   legacy;
}

# ── paths that must stay on WordPress until decommission ───────────────────
map $uri $aph_legacy_path {
    default              0;
    ~^/wp-admin          1;
    ~^/wp-login\.php     1;
    ~^/wp-json           1;   # keep integrations / app passwords alive
    ~^/wp-includes       1;
    ~^/xmlrpc\.php       1;
    ~^/my-account        1;   # not implemented in Nuxt yet
    ~^/wishlist          1;
    ~^/compare           1;
    ~^/wp-content/uploads 0;  # handled by Nuxt (mirror + proxy) so old media URLs keep working
}

# ── final routing decision ─────────────────────────────────────────────────
map "$aph_legacy_path:$aph_sticky:$aph_bucket" $aph_backend {
    default          aph_legacy;
    "0:new:new"      aph_new;
    "0:new:legacy"   aph_new;
    "0:legacy:new"   aph_new;
    "0:legacy:legacy" aph_legacy;
}

# Only idempotent requests may silently fall back to WordPress; a POST must never
# be replayed against the other stack (double orders / split-brain).
map $request_method $aph_fallback_enabled {
    default 0;
    GET     1;
    HEAD    1;
}

server {
    listen 443 ssl http2;
    server_name www.aph-ita.co.th aph-ita.co.th;

    ssl_certificate     /etc/letsencrypt/live/aph-ita.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aph-ita.co.th/privkey.pem;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # ── keep the visitor on the stack that served their first page ──────────
    # (set by the log/mirror stage; harmless for WordPress)
    add_header Set-Cookie "aph_edge=$aph_backend_nick; Path=/; SameSite=Lax" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # trailing slash: WordPress serves /product/x/ , Nuxt serves /product/x.
        # The Nuxt side strips it internally, so the address bar never changes.
        proxy_pass http://$aph_backend;

        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # automatic rollback: if Nuxt errors, WordPress serves the page instead
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @legacy_fallback;
    }

    location @legacy_fallback {
        internal;
        proxy_pass http://aph_legacy;
        proxy_set_header Host $host;
        add_header X-APH-Fallback "legacy" always;
    }
}

# ── Cloudflare / CDN origin pull variant (no TLS, private network) ─────────
server {
    listen 8081;
    server_name _;
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://$aph_backend;
        proxy_intercept_errors on;
        error_page 502 503 504 = @legacy_fallback2;
    }
    location @legacy_fallback2 { internal; proxy_pass http://aph_legacy; }
}
