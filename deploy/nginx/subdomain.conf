# ════════════════════════════════════════════════════════════════════════════
#  new.aph-ita.co.th — staging / UAT sub-domain for the Nuxt site
#
#  Purpose: let the team (and, if you want, real customers) use the new site on a
#  separate host name while www.aph-ita.co.th keeps serving WordPress untouched.
#  It is NOT a cut-over mechanism: visitors must stay on www, otherwise the URL,
#  cookies and SEO signals change (see docs/SUBDOMAIN-SETUP.md).
#
#  Four layers keep it out of Google:
#    1. X-Robots-Tag header (this file)                2. meta robots (app)
#    3. robots.txt "Disallow: /" (app)                 4. basic auth + optional IP allow-list
#
#  Install:  /etc/nginx/sites-available/new.aph-ita.co.th  → symlink into sites-enabled
#  Cert:     sudo certbot --nginx -d new.aph-ita.co.th
# ════════════════════════════════════════════════════════════════════════════

upstream aph_nuxt_staging {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# optional: only allow the office / VPN to open the staging site
geo $aph_allowed_ip {
    default 0;
    # 203.0.113.0/24  1;      # ← uncomment and add your IP ranges
    # 10.0.0.0/8      1;
}

server {
    listen 80;
    server_name new.aph-ita.co.th;
    return 301 https://$host$request_uri;        # certbot will replace this block
}

server {
    listen 443 ssl http2;
    server_name new.aph-ita.co.th;

    ssl_certificate     /etc/letsencrypt/live/new.aph-ita.co.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.aph-ita.co.th/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # ── layer 4: keep strangers out (optional but recommended during UAT) ──
    # auth_basic           "APH staging";
    # auth_basic_user_file /etc/nginx/.htpasswd-aph;      # htpasswd -c /etc/nginx/.htpasswd-aph aph

    # ── layer 1: never index ───────────────────────────────────────────────
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header X-APH-Env   "staging" always;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # raw HTML must not be cached by a CDN while we are still shaking out bugs
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    location / {
        # if ($aph_allowed_ip = 0) { return 403; }         # ← with the geo block above

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_pass http://aph_nuxt_staging;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # during UAT you want the error, not a silent fallback to WordPress
        # (so a broken build is visible immediately)
        proxy_intercept_errors off;
    }

    # Trailing-slash WordPress URLs (/product/x/, /product-category/a/b/) are handled inside
    # the app — no nginx rewrite, so the address bar keeps its original form.
}
